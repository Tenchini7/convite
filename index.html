<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um convite especial ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hearts"></div>

    <main class="container">

        <section class="card" id="inicio">

            <img src="princesa.jpg" alt="Princesa" class="foto">

            <div class="emoji">🥺🌹</div>

            <h1>Princesa, aceita sair comigo? ❤️</h1>

            <p class="texto">
                Eu queria muito passar um momento especial com você.
                Que tal a gente criar uma lembrança juntos? 💖
            </p>


            <div class="botoes">

                <button class="sim" onclick="aceitar()">
                    Sim ❤️
                </button>

                <button class="nao" id="nao">
                    Não 😢
                </button>

            </div>

        </section>


        <section class="card escondido" id="convite">

            <div class="envelope" onclick="abrirCarta()">

                💌

                <span>
                    Clique para abrir
                </span>

            </div>


            <div class="carta escondido" id="carta">

                <h2>Minha mensagem para você 💖</h2>

                <p id="textoCarta"></p>


                <div class="formulario">

                    <label>
                        Escolha a data:
                    </label>

                    <input type="date" id="data">


                    <label>
                        Escolha o horário:
                    </label>

                    <input type="time" id="hora">


                    <button onclick="confirmar()">
                        Confirmar encontro 💕
                    </button>

                </div>

            </div>


        </section>


        <section class="card escondido" id="confirmacao">

            <h1>
                🎉 Está confirmado! ❤️
            </h1>

            <p id="resultado"></p>

            <div class="final">
                Obrigado por aceitar 🥰
            </div>

        </section>


    </main>


<script src="script.js"></script>

</body>
</html>
